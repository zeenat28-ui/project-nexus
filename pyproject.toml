[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-nexus"
version = "0.2.0"
description = "Control and integration gateway for operating LLM inference servers across CPU, NVIDIA CUDA, and AMD ROCm backends."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43.0.0,<47.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
]
redis = [
    "redis>=5.0.0,<8.0.0",
]
dev = [
    "build>=1.2.1,<2.0.0",
    "mypy>=1.11.0,<2.0.0",
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "pytest>=8.2.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "redis>=5.0.0,<8.0.0",
    "ruff>=0.6.0,<1.0.0",
    "twine>=5.1.0,<7.0.0",
    "types-PyYAML>=6.0.12.20240808",
]

[project.scripts]
nexus = "project_nexus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["project_nexus"]
mypy_path = "src"

[tool.coverage.run]
source = ["project_nexus"]
branch = true

[tool.coverage.report]
show_missing = true
