# Local CPU-only configuration using the deterministic mock backend.
# Safe default: binds only to localhost (127.0.0.1) for both gateway and metrics.

server:
  host: "127.0.0.1"
  port: 8000

backend:
  type: "mock"
  model: "mock-llm-v1"
  mock:
    latency_ms: 0.0
    mode: "normal"
    response_prefix: "[mock]"

limits:
  max_request_bytes: 65536
  max_prompt_chars: 16384
  max_tokens_limit: 2048
  request_timeout_seconds: 35.0
  health_check_timeout_seconds: 3.0

circuit_breaker:
  failure_threshold: 3
  cooldown_seconds: 15.0

logging:
  level: "INFO"
  format: "json"

metrics:
  mode: "separate"
  host: "127.0.0.1"
  port: 9090
