# Example Deployment for the stateless Project Nexus serving gateway.
#
# IMPORTANT PRODUCTION LIMITATIONS:
# - Single replica by default (not HA; add replicas, PodDisruptionBudget, and topology spread).
# - Does not terminate TLS inside the pod; place behind an ingress controller, API gateway,
#   or mTLS service mesh before exposing to untrusted networks.
# - Replace the placeholder image tag with your published image pinned by immutable digest.
# - GPU resources belong on the separate inference engine Deployment (e.g., vLLM), NOT here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-gateway
  labels:
    app.kubernetes.io/name: nexus-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.4.0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "0.4.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexus-gateway
          # Replace with your registry image and pin by @sha256:... digest for production.
          image: ghcr.io/zeenat28-ui/project-nexus:0.4.0
          imagePullPolicy: IfNotPresent
          args:
            - "serve"
            - "--config"
            - "/etc/nexus/nexus.yaml"
          lifecycle:
            preStop:
              exec:
                # Allow Kubernetes Service endpoint propagation before SIGTERM triggers drain.
                command: ["python", "-c", "import time; time.sleep(5)"]
          env:
            - name: TMPDIR
              value: "/tmp"
            - name: NEXUS_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-gateway-secrets
                  key: gateway-api-key
            - name: NEXUS_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexus-gateway-secrets
                  key: metrics-bearer-token
            - name: NEXUS_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-gateway-secrets
                  key: backend-api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nexus
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: nexus-gateway-config
            items:
              - key: nexus.yaml
                path: nexus.yaml
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
