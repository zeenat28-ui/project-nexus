# TEMPLATE ONLY — DO NOT COMMIT REAL CREDENTIALS TO GIT.
# In production, populate secrets via External Secrets Operator, Vault,
# KMS-backed CSI driver, or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-gateway-secrets
  labels:
    app.kubernetes.io/name: nexus-gateway
type: Opaque
stringData:
  # Bearer token required by clients calling POST /v1/generate
  gateway-api-key: "REPLACE_WITH_HIGH_ENTROPY_GATEWAY_TOKEN"
  # Bearer token required by Prometheus when scraping port 9090 /metrics
  metrics-bearer-token: "REPLACE_WITH_HIGH_ENTROPY_METRICS_TOKEN"
  # Optional bearer token sent to the upstream inference backend
  backend-api-key: ""
