# Example ExternalSecret for External Secrets Operator (ESO).
# Requires the external-secrets.io CRD and a configured ClusterSecretStore
# (for example backed by HashiCorp Vault, AWS Secrets Manager, or GCP Secret Manager).
# Intentionally excluded from base kustomization.yaml so base renders without CRDs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-gateway-secrets
  labels:
    app.kubernetes.io/name: nexus-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: nexus-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: gateway-api-key
      remoteRef:
        key: project-nexus/gateway
        property: api_key
    - secretKey: metrics-bearer-token
      remoteRef:
        key: project-nexus/gateway
        property: metrics_bearer_token
    - secretKey: backend-api-key
      remoteRef:
        key: project-nexus/backend
        property: api_key
