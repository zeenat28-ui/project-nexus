apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# High-availability overlay adding multi-replica spread, PodDisruptionBudget,
# and HorizontalPodAutoscaler on top of the base gateway manifests.
resources:
  - ../../base
  - pdb.yaml
  - hpa.yaml

patches:
  - path: deployment-ha-patch.yaml
